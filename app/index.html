<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="build" content="__BUILD_SHA__" />
    <title>sched-prod · incidents</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <h1>incidents</h1>
      <p class="sub">sched-prod · tonight</p>
    </header>
    <main data-testid="board">
      <div data-testid="loader" class="loader">Loading incidents…</div>
      <p data-testid="empty" class="empty" hidden>No incidents.</p>
      <ul data-testid="incident-list" class="list" hidden></ul>
    </main>
    <div data-testid="confirm" class="confirm-backdrop" role="dialog" aria-modal="true" hidden>
      <div class="confirm-box">
        <p class="confirm-text"></p>
        <div class="confirm-actions">
          <button type="button" data-testid="confirm-cancel" class="confirm-cancel-btn">Cancel</button>
          <button type="button" data-testid="confirm-ack" class="confirm-ack-btn">Confirm Ack</button>
        </div>
      </div>
    </div>
    <footer>
      sched-prod incident board · build <span data-testid="build-sha">__BUILD_SHA__</span>
    </footer>
  </body>
</html>
